name: CI

# Runs on every push and PR. No AWS account, no secrets, no model calls, so it
# is safe to run anywhere. The deploy workflow (deploy.yml) stays opt-in.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies (incl. local-aws for the moto tests)
        run: uv sync --group local-aws

      - name: Run test suite
        run: uv run python -m pytest tests/ -q

      # Full ingest, analyze, brief chain on mock AWS. With no API key it runs
      # offline on a fictional sample with a stubbed model.
      - name: Local serverless end to end
        working-directory: infra
        run: make local-e2e

  template:
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: cfn-lint
        run: uvx cfn-lint infra/template.yaml

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: sam validate --lint
        working-directory: infra
        run: sam validate --lint

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run build:demo
