AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  BizBrief — event-driven serverless review-to-brief pipeline.
  Dropping uploads/<business_id>/<week>.jsonl into the raw bucket triggers
  ingest → analyze → brief, persisting to DynamoDB and rendering the brief JSON
  to the briefs bucket. Cost / latency / throughput are published as CloudWatch
  custom metrics and rendered on a live dashboard.

Parameters:
  AnthropicApiKey:
    Type: String
    NoEcho: true
    Description: >
      Anthropic API key. Stored in AWS Secrets Manager (NOT as a plaintext
      Lambda env var). The analyze/brief functions fetch it at cold start.
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  LogRetentionDays:
    Type: Number
    Default: 30
    Description: CloudWatch Logs retention for the Lambda log groups (cost control).
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365]
  AlarmEmail:
    Type: String
    Default: ""
    Description: >
      Optional email for the dead-letter-queue alarm. If set, you'll get an SNS
      confirmation email; confirm it to receive alerts when a run fails. Leave
      empty to create the alarm without email notification.

Conditions:
  # True when AlarmEmail is non-empty — gates the SNS email subscription.
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Globals:
  Function:
    Runtime: python3.11
    Timeout: 120          # analyze can fan out several model calls
    MemorySize: 512
    Architectures: [arm64]
    Environment:
      Variables:
        BIZBRIEF_TABLE: !Ref ReviewsTable
        # Static bucket names (not !Ref) so functions don't take a resource
        # dependency on the buckets — that !Ref is what created the S3-trigger
        # circular dependency. The names are deterministic via !Sub.
        BIZBRIEF_RAW_BUCKET: !Sub bizbrief-raw-${Stage}-${AWS::AccountId}
        BIZBRIEF_BRIEFS_BUCKET: !Sub bizbrief-briefs-${Stage}-${AWS::AccountId}
        # The key is fetched from Secrets Manager at cold start (see secrets.py),
        # NOT injected as a plaintext env var. Only the secret's ARN is exposed.
        ANTHROPIC_SECRET_ARN: !Ref AnthropicSecret

Resources:

  # ---------------------------------------------------------------------------
  # Log groups — created explicitly so retention is bounded (otherwise Lambda
  # auto-creates them with infinite retention = unbounded storage cost). Names
  # MUST match Lambda's convention (/aws/lambda/<function-name>); the functions
  # DependsOn these so the retention-bounded group exists before Lambda would
  # create its own.
  # ---------------------------------------------------------------------------
  IngestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/bizbrief-ingest-${Stage}
      RetentionInDays: !Ref LogRetentionDays
  AnalyzeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/bizbrief-analyze-${Stage}
      RetentionInDays: !Ref LogRetentionDays
  BriefLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/bizbrief-brief-${Stage}
      RetentionInDays: !Ref LogRetentionDays

  # ---------------------------------------------------------------------------
  # Storage
  # ---------------------------------------------------------------------------
  ReviewsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub bizbrief-${Stage}
      BillingMode: PAY_PER_REQUEST       # on-demand: no idle cost, scales to zero
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  # Anthropic API key in Secrets Manager. Seeded from the AnthropicApiKey
  # parameter at deploy time; the functions read it via secrets.py at cold start.
  # To rotate without redeploying: update the secret value directly in Secrets
  # Manager (aws secretsmanager put-secret-value ...).
  AnthropicSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub bizbrief/anthropic-api-key-${Stage}
      Description: Anthropic API key for BizBrief analyze/brief Lambdas.
      SecretString: !Ref AnthropicApiKey

  # The raw bucket's S3->Lambda notification is wired explicitly (not via SAM's
  # Events: S3 sugar) to avoid the CloudFormation circular dependency between
  # the bucket, the function, and the auto-generated invoke permission. The
  # bucket depends on the permission so S3 is allowed to invoke before the
  # notification is registered.
  RawBucket:
    Type: AWS::S3::Bucket
    DependsOn: IngestInvokePermission
    Properties:
      BucketName: !Sub bizbrief-raw-${Stage}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-raw-uploads
            Status: Enabled
            ExpirationInDays: 30          # raw uploads are transient input
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt IngestFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/
                  - Name: suffix
                    Value: .jsonl

  # Allows S3 to invoke the ingest function. Uses a static (account/region/stage)
  # bucket ARN as SourceArn rather than !Ref RawBucket, which is what breaks the
  # circular dependency (the permission no longer depends on the bucket resource).
  IngestInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref IngestFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub arn:aws:s3:::bizbrief-raw-${Stage}-${AWS::AccountId}

  # Hardening for the raw (trigger) bucket: on top of the public-access block,
  # explicitly DENY any write from a principal outside this account and DENY all
  # non-TLS access. The trigger fires on uploads/*.jsonl, and each upload costs
  # Anthropic spend downstream — so we lock writes to this account's principals.
  RawBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RawBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyWritesOutsideThisAccount
            Effect: Deny
            Principal: "*"
            Action: s3:PutObject
            Resource: !Sub arn:aws:s3:::bizbrief-raw-${Stage}-${AWS::AccountId}/*
            Condition:
              StringNotEquals:
                aws:PrincipalAccount: !Ref AWS::AccountId
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !Sub arn:aws:s3:::bizbrief-raw-${Stage}-${AWS::AccountId}
              - !Sub arn:aws:s3:::bizbrief-raw-${Stage}-${AWS::AccountId}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  BriefsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub bizbrief-briefs-${Stage}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # Dead-letter queue for failed async invocations (cloud analogue of
  # data/logs/dead-letter/). Failed events land here instead of vanishing.
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub bizbrief-dlq-${Stage}
      MessageRetentionPeriod: 1209600    # 14 days

  # SNS topic the DLQ alarm publishes to. If AlarmEmail is provided, an email
  # subscription is added (you must confirm the subscription email once).
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub bizbrief-alarms-${Stage}

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  # Fires when any message lands in the DLQ — i.e. a run failed all its retries.
  # Without this, failed runs sit silently in the queue. ApproximateNumberOf
  # MessagesVisible >= 1 over one period = "something failed, go look".
  DeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub bizbrief-dlq-not-empty-${Stage}
      AlarmDescription: A BizBrief run failed all retries and landed in the DLQ.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  # ---------------------------------------------------------------------------
  # Functions
  # ---------------------------------------------------------------------------
  IngestFunction:
    Type: AWS::Serverless::Function
    DependsOn: IngestLogGroup
    Properties:
      FunctionName: !Sub bizbrief-ingest-${Stage}
      CodeUri: lambdas/
      Handler: handler_ingest.handler
      Environment:
        Variables:
          ANALYZE_FUNCTION_NAME: !Sub bizbrief-analyze-${Stage}
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReviewsTable
        - S3ReadPolicy:
            BucketName: !Sub bizbrief-raw-${Stage}-${AWS::AccountId}
        - CloudWatchPutMetricPolicy: {}
        - LambdaInvokePolicy:
            FunctionName: !Sub bizbrief-analyze-${Stage}
      # S3 trigger wired explicitly via RawBucket.NotificationConfiguration +
      # IngestInvokePermission (above) to avoid a circular dependency.

  AnalyzeFunction:
    Type: AWS::Serverless::Function
    DependsOn: AnalyzeLogGroup
    Properties:
      FunctionName: !Sub bizbrief-analyze-${Stage}
      CodeUri: lambdas/
      Handler: handler_analyze.handler
      Timeout: 300
      Environment:
        Variables:
          BRIEF_FUNCTION_NAME: !Sub bizbrief-brief-${Stage}
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt DeadLetterQueue.Arn
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReviewsTable
        - CloudWatchPutMetricPolicy: {}
        - LambdaInvokePolicy:
            FunctionName: !Sub bizbrief-brief-${Stage}
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref AnthropicSecret

  BriefFunction:
    Type: AWS::Serverless::Function
    DependsOn: BriefLogGroup
    Properties:
      FunctionName: !Sub bizbrief-brief-${Stage}
      CodeUri: lambdas/
      Handler: handler_brief.handler
      Timeout: 180
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt DeadLetterQueue.Arn
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReviewsTable
        - S3CrudPolicy:
            BucketName: !Sub bizbrief-briefs-${Stage}-${AWS::AccountId}
        - CloudWatchPutMetricPolicy: {}
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref AnthropicSecret

  # ---------------------------------------------------------------------------
  # Live cost / latency / throughput dashboard
  # ---------------------------------------------------------------------------
  CostDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub BizBrief-${Stage}
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Model spend (USD) by stage",
                "region": "${AWS::Region}",
                "stat": "Sum", "period": 300,
                "metrics": [
                  [ "BizBrief", "CostUsd", "Stage", "analyze" ],
                  [ "BizBrief", "CostUsd", "Stage", "brief" ]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Spend by model (cost routing mix)",
                "region": "${AWS::Region}",
                "stat": "Sum", "period": 300,
                "metrics": [
                  [ "BizBrief", "CostUsd", "Stage", "analyze", "Model", "haiku" ],
                  [ "BizBrief", "CostUsd", "Stage", "analyze", "Model", "sonnet" ],
                  [ "BizBrief", "CostUsd", "Stage", "analyze", "Model", "opus" ]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Latency (ms) by stage",
                "region": "${AWS::Region}",
                "stat": "Average", "period": 300,
                "metrics": [
                  [ "BizBrief", "LatencyMs", "Stage", "ingest" ],
                  [ "BizBrief", "LatencyMs", "Stage", "analyze" ],
                  [ "BizBrief", "LatencyMs", "Stage", "brief" ]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Throughput (reviews) + prompt-cache tokens served",
                "region": "${AWS::Region}",
                "stat": "Sum", "period": 300,
                "metrics": [
                  [ "BizBrief", "Throughput", "Stage", "ingest" ],
                  [ "BizBrief", "CacheReadTokens", "Stage", "analyze", "Model", "sonnet" ],
                  [ "BizBrief", "CacheReadTokens", "Stage", "analyze", "Model", "opus" ]
                ]
              }
            }
          ]
        }

Outputs:
  RawBucketName:
    Description: Drop uploads/<business_id>/<week>.jsonl here to trigger the pipeline.
    Value: !Ref RawBucket
  BriefsBucketName:
    Description: Rendered <business_id>/<week>.brief.json objects land here.
    Value: !Ref BriefsBucket
  DashboardURL:
    Description: Live cost/latency/throughput dashboard.
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=BizBrief-${Stage}
